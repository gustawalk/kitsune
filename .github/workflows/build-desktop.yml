name: Build and release desktop application

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kitsune-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun ci
      - name: Check release versions and notes
        run: bun scripts/check-release.ts
      - run: bun test
      - run: bunx prettier --check src tests scripts docs README.md package.json index.html
      - run: bun run build

  windows:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 817892b0ecbc6af994dd6df999c73faf795adbf2
          path: .vcpkg
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: .vcpkg/installed
          key: windows-vcpkg-817892b-release-libpq-v2
      - name: Prepare database client libraries
        shell: pwsh
        run: |
          ./.vcpkg/bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg bootstrap failed' }
          ./.vcpkg/vcpkg.exe install libpq:x64-windows --disable-metrics --overlay-triplets=.github/vcpkg-triplets
          if ($LASTEXITCODE -ne 0) { throw 'Database client library build failed' }
          "KITSUNE_VCPKG_INSTALLED=$pwd/.vcpkg/installed/x64-windows" >> $env:GITHUB_ENV
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -property installationPath
          $redist = Get-ChildItem "$vs/VC/Redist/MSVC/*/x64/Microsoft.VC*.CRT" -Directory | Sort-Object FullName -Descending | Select-Object -First 1
          if (!$redist) { throw 'Missing x64 MSVC redistributable DLL directory' }
          "KITSUNE_MSVC_REDIST=$($redist.FullName)" >> $env:GITHUB_ENV
      - uses: actions/cache/save@v4
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: .vcpkg/installed
          key: windows-vcpkg-817892b-release-libpq-v2
      - run: bun ci
      - run: bun scripts/prepare-runtime.ts
      - name: Test Rust with Windows activation manifest
        run: bun run test:rust
      - name: Validate real Windows IPC contracts
        run: bun run test:contracts
      - name: Verify live MySQL and MariaDB on Windows
        shell: pwsh
        run: ./scripts/test-windows-engines.ps1
      - name: Require updater signing secrets
        shell: pwsh
        env:
          SIGNING_KEY: ${{ secrets.KITSUNE_TAURI_SIGNING_PRIVATE_KEY }}
          SIGNING_PASSWORD: ${{ secrets.KITSUNE_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:SIGNING_KEY -or -not $env:SIGNING_PASSWORD) { throw 'Configure the Kitsune updater signing secrets before building a release.' }
      - run: bun run tauri build --bundles nsis --ci --config src-tauri/tauri.runtime.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.KITSUNE_TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.KITSUNE_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Check signed Windows update artifact
        shell: pwsh
        run: |
          if (-not (Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*.exe.sig')) { throw 'Missing updater signature' }
      - name: Install and check executable, icons and database DLLs
        shell: pwsh
        run: ./scripts/check-windows-package.ps1
      - name: Keep loader diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kitsune-windows-loader-diagnostics
          path: |
            src-tauri/target/debug/deps/*.exe
            src-tauri/runtime/*.dll
          if-no-files-found: ignore
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: kitsune-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error
          retention-days: 7

  linux:
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - name: Make room for disposable server images
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - name: Install Tauri and database client dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --yes --no-install-recommends build-essential libayatana-appindicator3-dev libgtk-3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf pkg-config xdg-utils libpq-dev libfuse2
      - run: bun ci
      - run: bun scripts/prepare-runtime.ts
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: bun run test:contracts
      - name: Start isolated live database fixtures
        run: bun run engines:up --sqlserver
      - name: Verify PostgreSQL, MySQL, MariaDB and SQL Server end to end
        run: bun run engines:test --sqlserver
      - name: Stop isolated database fixtures
        if: always()
        run: bun run engines:down
      - name: Require updater signing secrets
        env:
          SIGNING_KEY: ${{ secrets.KITSUNE_TAURI_SIGNING_PRIVATE_KEY }}
          SIGNING_PASSWORD: ${{ secrets.KITSUNE_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: test -n "$SIGNING_KEY" && test -n "$SIGNING_PASSWORD"
      - run: bun run tauri build --bundles deb,appimage --ci --config src-tauri/tauri.runtime.conf.json
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.KITSUNE_TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.KITSUNE_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Check signed Linux update artifacts
        run: |
          ls src-tauri/target/release/bundle/deb/*.deb.sig
          ls src-tauri/target/release/bundle/appimage/*.AppImage.sig
      - name: Check Linux executable and desktop branding
        run: |
          test -x src-tauri/target/release/Kitsune
          find src-tauri/target/release/bundle/deb -name '*.desktop' -exec grep -l 'Name=Kitsune' {} +
          ls src-tauri/target/release/bundle/deb/Kitsune*.deb
          ls src-tauri/target/release/bundle/appimage/Kitsune*.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: kitsune-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.deb.sig
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [verify, windows, linux]
    runs-on: ubuntu-22.04
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: kitsune-*
          path: release-assets
          merge-multiple: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Generate signed updater manifest
        env:
          RELEASE_ASSETS_DIR: release-assets
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_NOTES_FILE: docs/releases/${{ github.ref_name }}.md
          UPDATER_MANIFEST_PATH: release-assets/updater.json
        run: bun scripts/generate-updater-manifest.ts
      - name: Publish release downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find release-assets -type f ! -name '*.sig' -print0)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --title "Kitsune ${GITHUB_REF_NAME}" --notes-file "docs/releases/${GITHUB_REF_NAME}.md" --verify-tag --latest
          fi
      - name: Remove temporary release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.artifacts[] | select(.name == "kitsune-windows" or .name == "kitsune-linux") | .id' | while read -r artifact_id; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done

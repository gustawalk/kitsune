# Disposable loopback-only fixtures. Never point these mounts at a user database.
name: kitsune-engine-tests
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: kitsune_test
      POSTGRES_PASSWORD: kitsune_test
      POSTGRES_DB: kitsune_test
    ports: ["127.0.0.1:55432:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    volumes:
      - ./tests/fixtures/postgres.sql:/docker-entrypoint-initdb.d/001-fixture.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kitsune_test -d kitsune_test"]
      interval: 2s
      timeout: 3s
      retries: 60
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: kitsune_fixture_root_only
      MYSQL_USER: kitsune_test
      MYSQL_PASSWORD: kitsune_test
      MYSQL_DATABASE: kitsune_test
    command: ["--require-secure-transport=ON", "--ssl-cert=/etc/kitsune-test/server.pem", "--ssl-key=/etc/kitsune-test/server-key.pem"]
    ports: ["127.0.0.1:53306:3306"]
    tmpfs: ["/var/lib/mysql"]
    volumes:
      - ./tests/fixtures/mysql.sql:/docker-entrypoint-initdb.d/001-fixture.sql:ro
      - ./.kitsune-engine-tests/tls/server.pem:/etc/kitsune-test/server.pem:ro
      - ./.kitsune-engine-tests/tls/server-key.pem:/etc/kitsune-test/server-key.pem:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysqladmin ping -h 127.0.0.1 -u kitsune_test --silent"]
      interval: 2s
      timeout: 3s
      retries: 90
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: kitsune_fixture_root_only
      MARIADB_USER: kitsune_test
      MARIADB_PASSWORD: kitsune_test
      MARIADB_DATABASE: kitsune_test
    command: ["--require-secure-transport=ON", "--ssl-cert=/etc/kitsune-test/server.pem", "--ssl-key=/etc/kitsune-test/server-key.pem"]
    ports: ["127.0.0.1:53307:3306"]
    tmpfs: ["/var/lib/mysql"]
    volumes:
      - ./tests/fixtures/mysql.sql:/docker-entrypoint-initdb.d/001-fixture.sql:ro
      - ./.kitsune-engine-tests/tls/server.pem:/etc/kitsune-test/server.pem:ro
      - ./.kitsune-engine-tests/tls/server-key.pem:/etc/kitsune-test/server-key.pem:ro
    healthcheck:
      test: ["CMD-SHELL", "MARIADB_PWD=$$MARIADB_PASSWORD mariadb-admin ping -h 127.0.0.1 -u kitsune_test --ssl --ssl-verify-server-cert=0 --silent"]
      interval: 2s
      timeout: 3s
      retries: 90
  sqlserver:
    profiles: ["sqlserver"]
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: Kitsune_fixture_42!
    ports: ["127.0.0.1:51433:1433"]
    healthcheck:
      test: ["CMD-SHELL", '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b']
      interval: 3s
      timeout: 5s
      retries: 90
